name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: prodkit
          POSTGRES_USER: prodkit
          POSTGRES_PASSWORD: prodkit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prodkit -d prodkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.8.1-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PRODKIT_STORAGE_ENVIRONMENT: test
      PRODKIT_STORAGE_DATABASE_URL: postgresql://prodkit:prodkit@127.0.0.1:5432/prodkit
      PRODKIT_STORAGE_REDIS_URL: redis://127.0.0.1:6379/0
      PRODKIT_STORAGE_CURSOR_SIGNING_SECRET: ci-secret-at-least-thirty-two-bytes-long
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: Bootstrap privileged PostgreSQL extensions
        run: |
          uv run python - <<'PY'
          import psycopg

          with psycopg.connect(
              "postgresql://prodkit:prodkit@127.0.0.1:5432/prodkit",
              autocommit=True,
          ) as connection:
              for extension in ("postgis", "pgcrypto"):
                  connection.execute(f"CREATE EXTENSION IF NOT EXISTS {extension}")
          PY
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run alembic upgrade head --sql > /tmp/migration.sql
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Capture Alembic revision state
        run: |
          {
            echo "=== current ==="
            uv run alembic current --verbose
            echo "=== heads ==="
            uv run alembic heads --verbose
            echo "=== history ==="
            uv run alembic history --verbose
            echo "=== CLI current ==="
            uv run prodkit-storage current
          } | tee /tmp/alembic-check.log
      - name: Check Alembic metadata drift
        run: |
          set -o pipefail
          uv run alembic check 2>&1 | tee -a /tmp/alembic-check.log
      - name: Upload Alembic drift report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prodkit-storage-alembic-check
          path: /tmp/alembic-check.log
          if-no-files-found: warn
      - name: Run tests
        run: |
          set -o pipefail
          uv run pytest --cov --cov-report=term-missing 2>&1 | tee /tmp/pytest.log
      - name: Upload pytest report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prodkit-storage-pytest
          path: /tmp/pytest.log
          if-no-files-found: warn
      - name: Verify one-step downgrade and roll-forward
        run: |
          uv run alembic downgrade -1
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: Audit Python dependencies
        run: uv run pip-audit
      - name: Build image
        run: docker build --tag prodkit-storage:ci .
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: prodkit-storage:ci
          format: json
          output: trivy-results.json
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prodkit-storage-trivy
          path: trivy-results.json
          if-no-files-found: error
      - name: Generate SPDX SBOM
        if: success()
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: prodkit-storage:ci
          format: spdx-json
          output-file: prodkit-storage.spdx.json
      - name: Upload SPDX SBOM
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prodkit-storage-sbom
          path: prodkit-storage.spdx.json
          if-no-files-found: error
