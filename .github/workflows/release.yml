name: Release

on:
  push:
    branches:
      - "release/v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: prodkit
          POSTGRES_USER: prodkit
          POSTGRES_PASSWORD: prodkit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prodkit -d prodkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      vector:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_DB: prodkit
          POSTGRES_USER: prodkit
          POSTGRES_PASSWORD: prodkit
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U prodkit -d prodkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.8.1-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PRODKIT_STORAGE_ENVIRONMENT: test
      PRODKIT_STORAGE_DATABASE_URL: postgresql://prodkit:prodkit@127.0.0.1:5432/prodkit
      PRODKIT_STORAGE_VECTOR_TEST_DATABASE_URL: postgresql://prodkit:prodkit@127.0.0.1:5433/prodkit
      PRODKIT_STORAGE_REDIS_URL: redis://127.0.0.1:6379/0
      PRODKIT_STORAGE_CURSOR_SIGNING_SECRET: release-proof-secret-at-least-thirty-two-bytes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Verify exact release source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )"
          test "$GITHUB_REF_NAME" = "release/v${version}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"
          test "$(git status --porcelain)" = ""
          echo "RELEASE_TAG=v${version}" >> "$GITHUB_ENV"
      - name: Verify locked source
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --all-extras --locked
          uv run ruff check .
          uv run mypy
          uv run pip-audit
      - name: Bootstrap privileged PostgreSQL extensions
        run: |
          uv run python - <<'PY'
          import psycopg

          with psycopg.connect(
              "postgresql://prodkit:prodkit@127.0.0.1:5432/prodkit",
              autocommit=True,
          ) as connection:
              for extension in ("postgis", "pgcrypto"):
                  connection.execute(f"CREATE EXTENSION IF NOT EXISTS {extension}")

          with psycopg.connect(
              "postgresql://prodkit:prodkit@127.0.0.1:5433/prodkit",
              autocommit=True,
          ) as connection:
              connection.execute("CREATE EXTENSION IF NOT EXISTS vector")
          PY
      - name: Verify PostgreSQL capabilities
        run: |
          uv run prodkit-storage capabilities \
            --require-extension postgis \
            --require-access-method gin \
            --require-text-search-config simple
          PRODKIT_STORAGE_DATABASE_URL="$PRODKIT_STORAGE_VECTOR_TEST_DATABASE_URL" \
            uv run prodkit-storage capabilities \
              --require-extension vector \
              --require-access-method hnsw \
              --require-access-method ivfflat
      - name: Verify migrations and schema
        run: |
          set -euo pipefail
          uv run alembic upgrade head --sql > /tmp/migration.sql
          uv run alembic upgrade head
          uv run alembic current --verbose
          uv run alembic heads --verbose
          uv run alembic check
          uv run prodkit-storage schema-check
          uv run prodkit-storage schema-check --async
      - name: Verify logical backup and restore
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          uv run python ops/backup/verify_postgres_backup.py \
            --database-url "$PRODKIT_STORAGE_DATABASE_URL" \
            --docker-container "$POSTGRES_CONTAINER"
      - name: Run complete test suite
        run: uv run pytest --cov --cov-report=term-missing
      - name: Run database and Redis saturation smoke
        run: |
          uv run python ops/load/storage_smoke.py \
            --iterations 40 \
            --concurrency 8 \
            --database-p95-ms 1000 \
            --redis-p95-ms 500
      - name: Verify dependency failures are visible and bounded
        run: uv run python ops/failure/dependency_failure_smoke.py
      - name: Verify one-step downgrade and roll-forward
        run: |
          uv run alembic downgrade -1
          uv run alembic upgrade head
          uv run alembic current
          uv run alembic check
          uv run prodkit-storage schema-check
          uv run prodkit-storage schema-check --async
      - name: Build and scan release image
        run: docker build --tag prodkit-storage:release .
      - name: Scan release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: prodkit-storage:release
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Build Python artifacts
        run: uv build --out-dir dist
      - name: Assemble source archive and checksums
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/prodkit-storage-${RELEASE_TAG}-source.tar.gz"
          git archive \
            --format=tar.gz \
            --prefix="prodkit-storage-${RELEASE_TAG}/" \
            -o "$archive" \
            HEAD
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          dist = Path("dist")
          checksum_file = dist / "SHA256SUMS"
          assets = sorted(
              path for path in dist.iterdir()
              if path.is_file() and path.name != checksum_file.name
          )
          if len(assets) < 3:
              raise SystemExit("expected wheel, sdist, and source archive")

          lines = []
          for path in assets:
              digest = sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              lines.append(f"{digest.hexdigest()}  {path.name}\n")
          checksum_file.write_text("".join(lines), encoding="utf-8")
          PY
          test -s dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Publish verified GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_API_URL: ${{ github.api_url }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: python ops/release/publish_release.py dist
      - name: Delete temporary release branch
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          api = os.environ["GITHUB_API_URL"].rstrip("/")
          repo = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["RELEASE_BRANCH"]
          token = os.environ["GITHUB_TOKEN"]
          url = f"{api}/repos/{repo}/git/refs/heads/{quote(branch, safe='/')}"
          request = Request(  # noqa: S310 - GITHUB_API_URL is GitHub-provided HTTPS.
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "User-Agent": "prodkit-storage-release-cleanup",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="DELETE",
          )
          with urlopen(request, timeout=60) as response:  # noqa: S310
              if response.status != 204:
                  raise SystemExit(f"unexpected cleanup status {response.status}")
          PY
