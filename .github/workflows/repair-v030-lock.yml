name: Repair v0.3.0 lockfile

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.head_ref == 'feat/storage-v0.3.0-operational-hardening' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/storage-v0.3.0-operational-hardening
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Generate and commit canonical lockfile
        run: |
          set -euo pipefail
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: refresh uv lockfile for v0.3.0"
          git push origin HEAD:feat/storage-v0.3.0-operational-hardening
