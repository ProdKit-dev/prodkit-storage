[build-system]
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

[project]
name = "prodkit-storage"
version = "0.2.1"
description = "Production-grade PostgreSQL/PostGIS, SQLAlchemy, Alembic, and Redis foundation for SaaS applications."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "ProdKit" }]
keywords = ["postgresql", "postgis", "sqlalchemy", "alembic", "redis", "saas", "asyncio"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "annotated-types>=0.7,<1",
  "SQLAlchemy[asyncio]>=2.0.51,<2.1",
  "alembic>=1.19,<2",
  "asyncpg>=0.30,<1",
  "geoalchemy2>=0.20,<1",
  "orjson>=3.10,<4",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.13.4,<3",
  "pydantic-settings>=2.14.2,<3",
  "redis>=8.1,<9",
  "typing-extensions>=4.12,<5",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115,<1"]
observability = [
  "opentelemetry-api>=1.44,<2",
  "opentelemetry-sdk>=1.44,<2",
  "opentelemetry-instrumentation-sqlalchemy>=0.65b0,<1",
  "opentelemetry-instrumentation-redis>=0.65b0,<1",
]
security = ["pip-audit>=2.10.1,<3"]
shapes = ["shapely>=2.0,<3"]
dev = [
  "mypy>=2.3,<3",
  "pre-commit>=4.0,<5",
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=7.1,<8",
  "ruff==0.16.1",
  "testcontainers[postgres,redis]>=4.10,<5",
]

[project.scripts]
prodkit-storage = "prodkit_storage.cli:main"

[project.urls]
Documentation = "https://github.com/ProdKit-dev/prodkit-storage#readme"
Repository = "https://github.com/ProdKit-dev/prodkit-storage"

[tool.hatch.build.targets.wheel]
packages = ["src/prodkit_storage"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF", "S", "C4"]
# Patch releases should not rewrite stable generic APIs solely for modernization/style.
ignore = ["S101", "SIM105", "SIM117", "UP017", "UP046", "UP047", "RUF012", "RUF022"]

[tool.ruff.lint.per-file-ignores]
"src/prodkit_storage/alembic/versions/*.py" = ["E501", "S608"]
"src/prodkit_storage/security/roles.py" = ["S608"]
"src/prodkit_storage/security/audit.py" = ["S105"]
"src/prodkit_storage/redis/rate_limit.py" = ["S105"]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["prodkit_storage"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["geoalchemy2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires PostgreSQL/PostGIS and Redis",
]

[tool.coverage.run]
branch = true
source = ["prodkit_storage"]
omit = ["src/prodkit_storage/alembic/env.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
